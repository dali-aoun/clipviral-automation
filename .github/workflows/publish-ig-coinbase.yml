name: Instagram Coinbase — @clipviral_viralclips

on:
  schedule:
    - cron: '0 15 * * *'  # 16h Tunisia (UTC+1)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Get next clip info
        id: clip
        run: |
          node automation/next-clip.mjs coinbase ig | while IFS='=' read key val; do
            echo "$key=$val" >> $GITHUB_OUTPUT
          done

      - name: Download clip from R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          mkdir -p /tmp/clips
          npx wrangler r2 object get clipviral-videos/${{ steps.clip.outputs.KEY }} --file /tmp/clips/${{ steps.clip.outputs.FILE }} --remote

      - name: Create .env
        env:
          IG_CV_TOKEN: ${{ secrets.IG_CV_TOKEN }}
          IG_CV_USER_ID: ${{ secrets.IG_CV_USER_ID }}
        run: |
          cat > .env << EOF
          CLIPS_DIR=/tmp/clips
          IG_CV_TOKEN=${IG_CV_TOKEN}
          IG_CV_USER_ID=${IG_CV_USER_ID}
          EOF

      - name: Publish to Instagram
        id: publish
        run: |
          node instagram/clipviral_viralclips/upload.mjs coinbase ${{ steps.clip.outputs.NUM }} | tee /tmp/ig_output.txt
          POST_URL=$(grep '^POST_URL=' /tmp/ig_output.txt | cut -d= -f2-)
          echo "POST_URL=$POST_URL" >> $GITHUB_OUTPUT

      - name: Submit to Whop ContentRewards
        env:
          WHOP_SESSION: ${{ secrets.WHOP_SESSION }}
        run: |
          echo "$WHOP_SESSION" | base64 -d > whop/session.json
          node whop/submit.mjs "${{ steps.publish.outputs.POST_URL }}"

      - name: Delete clip from R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler r2 object delete clipviral-videos/${{ steps.clip.outputs.KEY }} --remote

      - name: Advance state + commit
        run: |
          node automation/advance-state.mjs coinbase ig
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add automation/state.json
          git commit -m "chore: published coinbase ig clip ${{ steps.clip.outputs.NUM }}"
          git push
