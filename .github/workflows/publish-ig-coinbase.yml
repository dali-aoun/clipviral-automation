name: Instagram Coinbase — @clipviral_viralclips

on:
  schedule:
    - cron: '0 15 * * *'  # 16h Tunisia (UTC+1)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Get next clip info
        id: clip
        run: |
          node automation/next-clip.mjs coinbase ig | while IFS='=' read key val; do
            echo "$key=$val" >> $GITHUB_OUTPUT
          done

      - name: Download clip from R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          mkdir -p /tmp/clips
          npx wrangler r2 object get clipviral-videos/${{ steps.clip.outputs.KEY }} --file /tmp/clips/${{ steps.clip.outputs.FILE }}

      - name: Create .env
        env:
          IG_CV_TOKEN: ${{ secrets.IG_CV_TOKEN }}
          IG_CV_USER_ID: ${{ secrets.IG_CV_USER_ID }}
        run: |
          cat > .env << EOF
          CLIPS_DIR=/tmp/clips
          IG_CV_TOKEN=${IG_CV_TOKEN}
          IG_CV_USER_ID=${IG_CV_USER_ID}
          EOF

      - name: Publish to Instagram
        run: node instagram/clipviral_viralclips/upload.mjs coinbase ${{ steps.clip.outputs.NUM }}

      - name: Delete clip from R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler r2 object delete clipviral-videos/${{ steps.clip.outputs.KEY }}

      - name: Advance state + commit
        run: |
          node automation/advance-state.mjs coinbase ig
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add automation/state.json
          git commit -m "chore: published coinbase ig clip ${{ steps.clip.outputs.NUM }}"
          git push
