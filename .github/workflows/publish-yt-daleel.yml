name: YouTube Daleel — @QuranKarim-84

on:
  schedule:
    - cron: '0 9 * * *'   # 10h Tunisia (UTC+1)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Install Python + edge-tts + ffmpeg
        run: |
          pip install edge-tts
          sudo apt-get install -y ffmpeg

      - name: Get next clip info
        id: clip
        run: |
          node automation/next-clip.mjs daleel yt | while IFS='=' read key val; do
            echo "$key=$val" >> $GITHUB_OUTPUT
          done

      - name: Download clip from R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          mkdir -p /tmp/clips
          npx wrangler r2 object get clipviral-videos/${{ steps.clip.outputs.KEY }} --file /tmp/clips/${{ steps.clip.outputs.FILE }}

      - name: Setup YouTube credentials
        run: |
          echo '${{ secrets.YT_QURANKARIM_CREDENTIALS }}' | base64 -d > youtube/QuranKarim-84/credentials.json
          echo '${{ secrets.YT_QURANKARIM_TOKEN }}'       | base64 -d > youtube/QuranKarim-84/token.json

      - name: Create .env
        run: echo "DALEEL_CLIPS_DIR=/tmp/clips" > .env

      - name: Publish to YouTube
        run: node youtube/QuranKarim-84/upload.mjs daleel ${{ steps.clip.outputs.NUM }}

      - name: Delete clip from R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler r2 object delete clipviral-videos/${{ steps.clip.outputs.KEY }}

      - name: Advance state + commit
        run: |
          node automation/advance-state.mjs daleel yt
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add automation/state.json
          git commit -m "chore: published daleel yt clip ${{ steps.clip.outputs.NUM }}"
          git push
